<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Tryout TKA - Sukses PTN Al Bayan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#059669', primaryDark: '#047857', background: '#F8FAFC' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-background text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center gap-3">
            <a href="https://suksesptn.github.io" class="text-slate-400 hover:text-primary transition-colors p-1 rounded-full hover:bg-slate-100">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <div class="bg-primary text-white p-2 rounded-lg"><i data-lucide="file-text" class="w-5 h-5"></i></div>
            <div>
                <h1 class="text-lg font-bold text-slate-900 leading-tight">Hasil Tryout TKA</h1>
                <p class="text-xs text-slate-500">Program Sukses PTN Al Bayan</p>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 w-full">
        
        <!-- HALAMAN LOGIN -->
        <div id="loginPage" class="max-w-md mx-auto fade-in">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8">
                <div class="text-center mb-6">
                    <div class="bg-emerald-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="graduation-cap" class="w-8 h-8 text-primary"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">Login Siswa</h2>
                    <p class="text-sm text-slate-500">Masukkan NIS dan Tanggal Lahir untuk melihat hasil tryout</p>
                </div>

                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">NIS <span class="text-rose-500">*</span></label>
                        <input type="text" id="nis" required placeholder="Contoh: 242510006" 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50 transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Tanggal Lahir <span class="text-rose-500">*</span></label>
                        <input type="date" id="tglLahir" required 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50 transition-all">
                    </div>

                    <button type="submit" id="loginBtn" 
                        class="w-full bg-primary hover:bg-primaryDark text-white font-semibold py-4 rounded-xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i data-lucide="log-in" class="w-5 h-5"></i>
                        <span>Masuk</span>
                    </button>
                </form>

                <div id="loginError" class="hidden mt-4 p-4 rounded-xl bg-rose-50 border border-rose-200 text-sm text-rose-700 text-center flex items-start gap-2">
                    <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
                    <span id="loginErrorText"></span>
                </div>
            </div>
        </div>

        <!-- HALAMAN DASHBOARD (Hidden by default) -->
        <div id="dashboardPage" class="hidden space-y-6 fade-in">
            
            <!-- Welcome Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="bg-emerald-100 w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center flex-shrink-0">
                            <i data-lucide="user" class="w-6 h-6 sm:w-7 sm:h-7 text-primary"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h2 class="text-lg sm:text-xl font-bold text-slate-900 truncate" id="studentName">-</h2>
                            <p class="text-sm text-slate-500">NIS: <span id="studentNIS" class="font-medium text-slate-700">-</span> • Kelas: <span id="studentKelas" class="font-medium text-slate-700">-</span></p>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-2 rounded-lg transition-all" title="Keluar">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-12 text-center">
                <div class="animate-spin w-10 h-10 border-4 border-emerald-200 border-t-primary rounded-full mx-auto mb-4"></div>
                <p class="text-slate-600 font-medium">Memuat data tryout...</p>
            </div>

            <!-- Dashboard Content -->
            <div id="dashboardContent" class="hidden space-y-6">
                
                <!-- Statistik Ringkasan -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
                        <div class="flex items-center gap-2 mb-2">
                            <i data-lucide="award" class="w-5 h-5 text-primary"></i>
                            <span class="text-sm font-medium text-slate-600">TO Terakhir</span>
                        </div>
                        <div class="text-3xl font-bold text-slate-900" id="lastTOScore">-</div>
                        <p class="text-xs text-slate-500 mt-1" id="lastTOName">-</p>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
                        <div class="flex items-center gap-2 mb-2">
                            <i data-lucide="trending-up" class="w-5 h-5 text-blue-500"></i>
                            <span class="text-sm font-medium text-slate-600">Rata-rata</span>
                        </div>
                        <div class="text-3xl font-bold text-slate-900" id="avgScore">-</div>
                        <p class="text-xs text-slate-500 mt-1">Semua TO</p>
                    </div>
                </div>

                <!-- Grafik Perkembangan -->
                <div id="chartContainer" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6">
                    <div class="flex items-center gap-2 mb-5">
                        <i data-lucide="bar-chart-3" class="w-5 h-5 text-primary"></i>
                        <h3 class="text-lg font-semibold text-slate-900">Grafik Perkembangan</h3>
                    </div>
                    <div class="relative h-64 w-full">
                        <canvas id="progressChart"></canvas>
                    </div>
                </div>

                <!-- Nilai per Tryout -->
                <div class="flex items-center gap-2 mb-2">
                    <i data-lucide="clipboard-list" class="w-5 h-5 text-primary"></i>
                    <h3 class="text-lg font-semibold text-slate-900">Rincian Nilai per Tryout</h3>
                </div>
                <div id="toList" class="space-y-4">
                    <!-- Akan diisi oleh JavaScript -->
                </div>

            </div>
        </div>

    </main>

    <footer class="bg-white border-t border-slate-100 mt-auto py-6">
        <div class="max-w-5xl mx-auto px-4 text-center">
            <p class="text-xs text-slate-400">© 2026 Tim Sukses PTN Al Bayan</p>
        </div>
    </footer>

    <script>
        // ==========================================================
        // URL APPS SCRIPT ANDA (SUDAH DIUPDATE)
        // ==========================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyl62T0603t9LXy1JgJO6chilU4Xv4KQYfQR4kZb8dQlum47cmFn-uFkNtcbUxk8cx6/exec";
        
        let currentStudent = null;
        let chartInstance = null;

        // Initialize icons
        lucide.createIcons();

        // Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nis = document.getElementById('nis').value.trim();
            const tglLahir = document.getElementById('tglLahir').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');
            const loginErrorText = document.getElementById('loginErrorText');
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span>Memproses...</span>';
            loginError.classList.add('hidden');
            
            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?action=login&nis=${encodeURIComponent(nis)}&tglLahir=${tglLahir}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    currentStudent = result;
                    showDashboard();
                } else {
                    loginErrorText.textContent = result.message || 'Data tidak ditemukan. Periksa kembali NIS dan Tanggal Lahir Anda.';
                    loginError.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Login error:', err);
                loginErrorText.innerHTML = 'Gagal terhubung ke server.<br>Pastikan koneksi internet stabil dan coba lagi.';
                loginError.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i><span>Masuk</span>';
                lucide.createIcons();
            }
        });

        function showDashboard() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
            
            // Set student info
            document.getElementById('studentName').textContent = currentStudent.nama;
            document.getElementById('studentNIS').textContent = currentStudent.nis;
            document.getElementById('studentKelas').textContent = currentStudent.kelas;
            
            // Show loading
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('dashboardContent').classList.add('hidden');
            
            // Fetch nilai
            loadNilaiSiswa();
        }

        async function loadNilaiSiswa() {
            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getNilai&nis=${encodeURIComponent(currentStudent.nis)}`);
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const result = await response.json();
                
                document.getElementById('loadingState').classList.add('hidden');
                
                if (result.success) {
                    renderDashboard(result.nilai);
                } else {
                    alert('Gagal memuat data: ' + (result.message || 'Data tidak ditemukan'));
                    logout();
                }
            } catch (err) {
                console.error('Fetch nilai error:', err);
                document.getElementById('loadingState').classList.add('hidden');
                alert('Terjadi kesalahan jaringan saat memuat data nilai.');
            }
        }

        function renderDashboard(nilaiData) {
            document.getElementById('dashboardContent').classList.remove('hidden');
            
            const toKeys = Object.keys(nilaiData);
            
            if (toKeys.length === 0) {
                document.getElementById('dashboardContent').innerHTML = '<div class="bg-white rounded-2xl p-8 text-center text-slate-500 border border-slate-100">Belum ada data tryout yang tercatat untuk Anda.</div>';
                return;
            }
            
            // Hitung statistik
            const lastTO = toKeys[toKeys.length - 1];
            const lastScore = nilaiData[lastTO].rataRata.toFixed(2);
            document.getElementById('lastTOScore').textContent = lastScore;
            document.getElementById('lastTOName').textContent = lastTO;
            
            // Rata-rata semua TO
            let totalAll = 0;
            toKeys.forEach(to => { totalAll += nilaiData[to].rataRata; });
            const avgAll = (totalAll / toKeys.length).toFixed(2);
            document.getElementById('avgScore').textContent = avgAll;
            
            // Render grafik jika ada lebih dari 1 TO
            if (toKeys.length > 1) {
                document.getElementById('chartContainer').classList.remove('hidden');
                renderChart(nilaiData, toKeys);
            } else {
                document.getElementById('chartContainer').classList.add('hidden');
            }
            
            // Render list TO
            const toList = document.getElementById('toList');
            toList.innerHTML = '';
            
            // Reverse agar TO terbaru di atas
            [...toKeys].reverse().forEach(to => {
                const data = nilaiData[to];
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6 fade-in';
                
                let wajibHTML = '';
                Object.entries(data.wajib).forEach(([mapel, nilai]) => {
                    wajibHTML += `
                        <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3 text-center">
                            <div class="text-xs text-slate-600 mb-1 font-medium">${mapel}</div>
                            <div class="text-lg font-bold text-emerald-700">${nilai.toFixed(2)}</div>
                        </div>`;
                });

                let pilihanHTML = '';
                Object.entries(data.pilihan).forEach(([mapel, nilai]) => {
                    pilihanHTML += `
                        <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 text-center">
                            <div class="text-xs text-slate-600 mb-1 font-medium">${mapel}</div>
                            <div class="text-lg font-bold text-blue-700">${nilai.toFixed(2)}</div>
                        </div>`;
                });

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-5 pb-4 border-b border-slate-100">
                        <div class="flex items-center gap-2">
                            <div class="bg-primary/10 p-2 rounded-lg">
                                <i data-lucide="clipboard-check" class="w-5 h-5 text-primary"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900">${to}</h3>
                        </div>
                        <div class="text-right">
                            <div class="text-2xl font-bold text-primary">${data.rataRata.toFixed(2)}</div>
                            <p class="text-xs text-slate-500 font-medium">Rata-rata</p>
                        </div>
                    </div>
                    
                    <div class="space-y-5">
                        <div>
                            <h4 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                                <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full"></span>
                                Mata Pelajaran Wajib
                            </h4>
                            <div class="grid grid-cols-3 sm:grid-cols-3 gap-3">
                                ${wajibHTML || '<p class="text-sm text-slate-400 col-span-3">Tidak ada data</p>'}
                            </div>
                        </div>
                        
                        <div>
                            <h4 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                                <span class="w-2.5 h-2.5 bg-blue-500 rounded-full"></span>
                                Mata Pelajaran Pilihan
                            </h4>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                ${pilihanHTML || '<p class="text-sm text-slate-400 col-span-2 sm:col-span-4">Tidak ada data</p>'}
                            </div>
                        </div
                    </div>
                `;
                toList.appendChild(card);
            });
            
            lucide.createIcons();
        }

        function renderChart(nilaiData, toKeys) {
            const ctx = document.getElementById('progressChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }
            
            const labels = toKeys;
            const data = toKeys.map(to => nilaiData[to].rataRata);
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Rata-rata Nilai',
                        data: data,
                        borderColor: '#059669',
                        backgroundColor: 'rgba(5, 150, 105, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#059669',
                        pointBorderWidth: 3,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            padding: 12,
                            titleFont: { family: 'Poppins', size: 13 },
                            bodyFont: { family: 'Poppins', size: 14, weight: 'bold' },
                            callbacks: {
                                label: function(context) {
                                    return 'Nilai: ' + context.parsed.y.toFixed(2);
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            min: 40,
                            max: 100,
                            grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
                            ticks: { font: { family: 'Poppins', size: 11 } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { family: 'Poppins', size: 11, weight: '500' } }
                        }
                    }
                }
            });
        }

        function logout() {
            currentStudent = null;
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('loginForm').reset();
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('dashboardContent').classList.add('hidden');
            document.getElementById('chartContainer').classList.add('hidden');
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
        }
    </script>
</body>
</html>

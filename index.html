<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Presensi Guru - Sukses PTN Al Bayan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] } } } };
  </script>
  <style>
    input[type="checkbox"] { accent-color: #059669; }
    select:disabled { opacity: 0.5; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased pb-28" style="font-family:'Poppins',sans-serif;">

  <header class="bg-white p-4 shadow-sm sticky top-0 z-30 border-b border-slate-100">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="https://suksesptn.github.io" class="text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        </a>
        <div class="bg-emerald-600 text-white p-2 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 leading-tight">Presensi Guru</h1>
          <p class="text-xs text-slate-500">Program Sukses PTN Al Bayan</p>
        </div>
      </div>
      <span id="loading-badge" class="hidden text-xs bg-emerald-100 text-emerald-700 font-bold px-3 py-1.5 rounded-full animate-pulse">Memuat...</span>
    </div>
  </header>

  <main class="max-w-md mx-auto mt-5 px-4 space-y-5">

    <!-- Pilihan Modul Presensi -->
    <div class="bg-white p-1 rounded-2xl shadow-sm border border-slate-200">
      <select id="active_tab" onchange="switchTab(parseInt(this.value))" class="w-full p-4 bg-transparent text-emerald-700 font-bold text-base focus:outline-none appearance-none text-center cursor-pointer">
        <option value="1">1. Intensif SNBT</option>
        <option value="2">2. Intensif TKA</option>
        <option value="3">3. Intensif IUP</option>
        <option value="4">4. Intensif Ujian Mandiri</option>
        <option value="5">5. Tambahan Sore</option>
        <option value="6">6. KBM Online</option>
        <option value="7">7. Petugas KBM Online</option>
        <option value="8">8. Pengawas Tryout</option>
      </select>
      <div class="text-center text-xs text-slate-400 pb-2">Ketuk untuk mengganti jenis presensi 👆</div>
    </div>

    <form id="attendanceForm" onsubmit="submitForm(event)" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-5">

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Tanggal</label>
        <input type="date" id="tanggal" required class="w-full p-3.5 border border-slate-300 rounded-xl text-base bg-slate-50 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
      </div>

      <div id="field_jenis_to" class="hidden">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Jenis Tryout</label>
        <select id="jenis_to" class="w-full p-3.5 border border-slate-300 rounded-xl text-base bg-slate-50">
          <option value="Tryout UTBK">Tryout UTBK</option>
          <option value="Tryout TKA">Tryout TKA</option>
        </select>
      </div>

      <div id="field_waktu" class="hidden grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Waktu Mulai</label>
          <input type="time" id="waktu_mulai" class="w-full p-3.5 border border-slate-300 rounded-xl text-base bg-slate-50">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Selesai</label>
          <input type="time" id="waktu_selesai" class="w-full p-3.5 border border-slate-300 rounded-xl text-base bg-slate-50">
        </div>
      </div>

      <div id="field_mapel">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Mata Pelajaran</label>
        <select id="mapel" onchange="filterGuru()" class="w-full p-3.5 border border-slate-300 rounded-xl text-base bg-slate-50 focus:ring-2 focus:ring-emerald-500">
          <option value="">-- Pilih Mapel --</option>
        </select>
      </div>

      <div>
        <label id="label_guru" class="block text-sm font-semibold text-slate-700 mb-1.5">Guru Pengajar</label>
        <select id="guru" required class="w-full p-3.5 border border-slate-300 rounded-xl text-base bg-slate-50 focus:ring-2 focus:ring-emerald-500">
          <option value="">-- Pilih Guru --</option>
        </select>
      </div>

      <div id="field_kelas">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Kelas</label>
        <select id="kelas" onchange="loadSiswa()" class="w-full p-3.5 border border-slate-300 rounded-xl text-base bg-slate-50 focus:ring-2 focus:ring-emerald-500">
          <option value="">-- Pilih Kelas --</option>
        </select>
      </div>

      <div id="field_jp">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Jumlah JP</label>
        <div class="flex items-center gap-4">
          <input type="number" id="jp" min="1" max="10" value="2" class="w-24 p-3.5 border border-slate-300 rounded-xl text-center text-lg font-bold bg-slate-50 focus:ring-2 focus:ring-emerald-500">
          <span class="text-slate-500">Jam Pelajaran</span>
        </div>
      </div>

      <div id="field_siswa_list" class="pt-2 border-t border-slate-200">
        <label class="block text-sm font-bold text-slate-800 mb-2">Daftar Kehadiran Siswa</label>
        <div id="hint_box" class="px-3 py-2.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm font-semibold flex items-center gap-2 mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
          <span>Ceklis siswa yang HADIR di kelas</span>
        </div>
        <div id="siswa_container" class="border border-slate-200 rounded-xl bg-slate-50 divide-y divide-slate-200 overflow-hidden">
          <div class="p-6 text-center text-slate-400 text-sm">Silakan pilih kelas terlebih dahulu</div>
        </div>
      </div>

      <div id="field_manual_siswa">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Tambah Siswa Manual <span class="font-normal text-slate-500 text-xs">(opsional, pisahkan koma/enter)</span></label>
        <textarea id="siswa_manual" rows="2" placeholder="Contoh: Ahmad Fauzi, Budi Santoso" class="w-full p-3.5 border border-slate-300 rounded-xl text-base bg-slate-50 focus:ring-2 focus:ring-emerald-500"></textarea>
        <p class="text-xs text-slate-500 mt-1">* Siswa manual otomatis dianggap hadir</p>
      </div>
    </form>

    <p class="text-center text-xs text-slate-400">v4 • Tim Sukses PTN Al Bayan</p>
  </main>

  <!-- Tombol Submit menempel di bawah -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-40">
    <div class="max-w-md mx-auto">
      <button type="submit" form="attendanceForm" id="btnSubmit" class="w-full bg-emerald-600 active:bg-emerald-800 text-white font-bold text-lg py-4 rounded-xl shadow-lg transition-transform transform active:scale-95 flex justify-center items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
        SIMPAN PRESENSI
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // URL WEB APP GOOGLE APPS SCRIPT
    // ==========================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbydQLyp6LkW3Nvu1kyQ9v_n0FZfi-dAAzsoCCXEzUXZ18sUcYoljAmXxaPR5YTAK41QfQ/exec';

    // Aturan tampilan & sumber data per tab
    const PROGRAM_MAP = {
      1: { guru: 'SNBT', siswa: 'SNBT', mode: 'intensif' },
      2: { guru: 'TKA',  siswa: 'TKA',  mode: 'intensif' },
      3: { guru: 'IUP',  siswa: 'IUP',  mode: 'intensif' },
      4: { guru: 'UM',   siswa: 'UM',   mode: 'intensif' },
      5: { guru: '',     siswa: '',     mode: 'manual'   }, // Tambahan Sore
      6: { guru: '',     siswa: '',     mode: 'online'   }, // KBM Online
      7: { guru: '',     siswa: '',     mode: 'petugas'  }, // Petugas KBM Online
      8: { guru: '',     siswa: '',     mode: 'pengawas' }  // Pengawas Tryout
    };

    let masterData = { guru: [], siswa: [] };

    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }

    // ===== Muat data master saat halaman dibuka =====
    document.addEventListener("DOMContentLoaded", async function () {
      document.getElementById('tanggal').valueAsDate = new Date();
      document.getElementById('loading-badge').classList.remove('hidden');
      try {
        const response = await fetch(SCRIPT_URL + '?action=getMasterData');
        masterData = await response.json();
        switchTab(parseInt(document.getElementById('active_tab').value));
      } catch (error) {
        console.error('Error fetching data:', error);
        alert("Gagal memuat data dari Spreadsheet. Periksa koneksi lalu refresh halaman.");
      }
      document.getElementById('loading-badge').classList.add('hidden');
    });

    // ===== Dropdown Mapel sesuai program =====
    function updateMapelDropdown(targetProgram) {
      const select = document.getElementById('mapel');
      select.innerHTML = '<option value="">-- Pilih Mapel --</option>';
      let filtered = masterData.guru;
      if (targetProgram) filtered = filtered.filter(function (g) { return g.program === targetProgram; });
      const unique = [];
      filtered.forEach(function (g) { if (g.mapel && unique.indexOf(g.mapel) === -1) unique.push(g.mapel); });
      unique.sort().forEach(function (m) { select.innerHTML += '<option value="' + m + '">' + m + '</option>'; });
    }

    // ===== Dropdown Guru (filter program + mapel) =====
    function filterGuru() {
      const tab = parseInt(document.getElementById('active_tab').value);
      const info = PROGRAM_MAP[tab];
      const mapelSelected = document.getElementById('mapel').value;
      const select = document.getElementById('guru');

      let filtered = masterData.guru;
      if (info.guru) filtered = filtered.filter(function (g) { return g.program === info.guru; });
      if (mapelSelected) filtered = filtered.filter(function (g) { return g.mapel === mapelSelected; });

      select.innerHTML = '<option value="">-- Pilih Guru --</option>';
      const seen = [];
      filtered.sort(function (a, b) { return a.nama.localeCompare(b.nama); }).forEach(function (g) {
        let label = g.nama;
        if (!mapelSelected && g.mapel && info.mode === 'intensif') label = g.nama + ' (' + g.mapel + ')';
        if (seen.indexOf(label) === -1) {
          seen.push(label);
          select.innerHTML += '<option value="' + g.nama + '">' + label + '</option>';
        }
      });
    }

    // ===== Dropdown Kelas sesuai program =====
    function updateKelasDropdown(targetProgram) {
      const select = document.getElementById('kelas');
      select.innerHTML = '<option value="">-- Pilih Kelas --</option>';
      if (!targetProgram) return;
      const unique = [];
      masterData.siswa.forEach(function (s) {
        if (s.program === targetProgram && s.kelas && unique.indexOf(s.kelas) === -1) unique.push(s.kelas);
      });
      unique.sort().forEach(function (k) { select.innerHTML += '<option value="' + k + '">' + k + '</option>'; });
    }

    // ===== Render daftar siswa + checkbox HADIR =====
    function loadSiswa() {
      const tab = parseInt(document.getElementById('active_tab').value);
      const info = PROGRAM_MAP[tab];
      const kelasSelected = document.getElementById('kelas').value;
      const container = document.getElementById('siswa_container');

      let daftar = [];
      if (info.siswa && kelasSelected) {
        daftar = masterData.siswa
          .filter(function (s) { return s.program === info.siswa && s.kelas === kelasSelected; })
          .map(function (s) { return s.nama; })
          .sort(function (a, b) { return a.localeCompare(b); });
      }

      container.innerHTML = '';
      if (daftar.length === 0) {
        container.innerHTML = '<div class="p-6 text-center text-slate-400 text-sm">Silakan pilih kelas terlebih dahulu</div>';
        return;
      }

      daftar.forEach(function (nama) {
        container.innerHTML +=
          '<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-100 active:bg-slate-200 transition-colors">' +
          '<span class="text-base text-slate-800 font-medium select-none">' + nama + '</span>' +
          '<input type="checkbox" name="siswa_check" value="' + nama + '" class="w-7 h-7 bg-white border-slate-300 rounded focus:ring-emerald-500 shadow-sm cursor-pointer">' +
          '</label>';
      });
    }

    // ===== Atur tampilan form saat ganti tab =====
    function switchTab(tabNum) {
      const info = PROGRAM_MAP[tabNum];

      show('field_mapel'); show('field_kelas'); show('field_jp');
      show('field_siswa_list'); show('field_manual_siswa');
      hide('field_jenis_to'); hide('field_waktu');
      document.getElementById('label_guru').innerText = 'Guru Pengajar';

      if (info.mode === 'manual') {
        hide('field_kelas'); hide('field_siswa_list');
      } else if (info.mode === 'online') {
        hide('field_kelas'); hide('field_siswa_list'); hide('field_manual_siswa');
      } else if (info.mode === 'petugas') {
        hide('field_mapel'); hide('field_kelas'); hide('field_jp');
        hide('field_siswa_list'); hide('field_manual_siswa');
        document.getElementById('label_guru').innerText = 'Guru Piket / Petugas';
      } else if (info.mode === 'pengawas') {
        hide('field_mapel'); hide('field_kelas'); hide('field_jp');
        hide('field_siswa_list'); hide('field_manual_siswa');
        show('field_jenis_to'); show('field_waktu');
        document.getElementById('label_guru').innerText = 'Nama Pengawas';
      }

      updateMapelDropdown(info.guru);
      filterGuru();
      updateKelasDropdown(info.siswa);
      loadSiswa();
    }

    // ===== Submit presensi =====
    async function submitForm(e) {
      e.preventDefault();
      const tab = parseInt(document.getElementById('active_tab').value);
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.innerHTML = '<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> MEMPROSES...';

      const hadir = Array.from(document.querySelectorAll('input[name="siswa_check"]:checked')).map(function (cb) { return cb.value; });
      const semua = Array.from(document.querySelectorAll('input[name="siswa_check"]')).map(function (cb) { return cb.value; });
      const tidakHadir = semua.filter(function (s) { return hadir.indexOf(s) === -1; });

      const payload = {
        jenis: document.getElementById('active_tab').selectedOptions[0].text.substring(3),
        tanggal: document.getElementById('tanggal').value,
        mapel: document.getElementById('mapel').value,
        guru: document.getElementById('guru').value,
        kelas: document.getElementById('kelas').value,
        jp: document.getElementById('jp').value,
        hadir: hadir,
        tidak_hadir: tidakHadir,
        siswa_manual: document.getElementById('siswa_manual').value,
        jenis_to: document.getElementById('jenis_to').value,
        waktu_mulai: document.getElementById('waktu_mulai').value,
        waktu_selesai: document.getElementById('waktu_selesai').value
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const res = await response.json();

        if (res.status === 'success') {
          alert('✅ ' + res.message + '\nHadir: ' + res.totalHadir + ' | Tidak Hadir: ' + res.totalTidakHadir);
          document.getElementById('attendanceForm').reset();
          document.getElementById('tanggal').valueAsDate = new Date();
          switchTab(tab);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          alert('❌ Gagal: ' + res.message);
        }
      } catch (error) {
        console.error('Error submitting form:', error);
        alert('Terjadi kesalahan jaringan saat menyimpan data.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg> SIMPAN PRESENSI';
      }
    }
  </script>
</body>
</html>

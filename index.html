<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Presensi Guru - Sukses PTN Al Bayan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] }, colors: { primary: '#059669', primaryDark: '#047857', background: '#F8FAFC' } } }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        select:disabled { opacity: 0.5; cursor: not-allowed; }
        input[type="checkbox"] { accent-color: #059669; }
    </style>
</head>
<body class="bg-background text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center gap-3">
            <a href="https://suksesptn.github.io" class="text-slate-400 hover:text-primary transition-colors">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <div class="bg-primary text-white p-2 rounded-lg"><i data-lucide="clipboard-check" class="w-5 h-5"></i></div>
            <div>
                <h1 class="text-lg font-bold text-slate-900">Presensi Guru</h1>
                <p class="text-xs text-slate-500">Program Sukses PTN Al Bayan</p>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 w-full">
        <!-- onsubmit inline = pengaman: form TIDAK AKAN PERNAH terkirim sebagai GET -->
        <form id="presensiForm" onsubmit="event.preventDefault(); if (typeof handleSubmit === 'function') handleSubmit(event);">

            <div class="space-y-6">
            <!-- Card 1: Informasi Presensi -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6">
                <div class="flex items-center gap-2 mb-5">
                    <i data-lucide="file-text" class="w-5 h-5 text-primary"></i>
                    <h2 class="text-lg font-semibold text-slate-900">Informasi Presensi</h2>
                </div>

                <div id="loadBanner" class="mb-5 flex items-center gap-3 text-sm text-slate-600 bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3">
                    <svg id="loadSpinner" class="animate-spin h-4 w-4 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span id="loadBannerText">Memuat data guru & siswa...</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Jenis Presensi <span class="text-rose-500">*</span></label>
                        <select id="jenis" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50 font-medium">
                            <option value="" disabled selected>Pilih Jenis Presensi...</option>
                            <option value="TKA">Intensif TKA</option>
                            <option value="SNBT">Intensif SNBT</option>
                            <option value="IUP">Intensif IUP</option>
                            <option value="Ujian Mandiri">Intensif Ujian Mandiri</option>
                            <option value="Tambahan Sore">Tambahan Sore</option>
                            <option value="KBM Online">KBM Online</option>
                            <option value="Petugas KBM Online">Petugas KBM Online</option>
                            <option value="Pengawas Tryout">Pengawas Tryout</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Tanggal <span class="text-rose-500">*</span></label>
                        <input type="date" id="tanggal" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Jumlah JP <span class="text-rose-500">*</span></label>
                        <input type="number" id="jp" value="2" min="1" max="10" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Mata Pelajaran</label>
                        <select id="mapel" disabled class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50"><option value="" disabled selected>Pilih jenis presensi dulu</option></select>
                        <input type="text" id="mapel_manual" placeholder="Contoh: Fisika" class="hidden w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Nama Guru <span class="text-rose-500">*</span></label>
                        <select id="guru" disabled class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50"><option value="" disabled selected>Pilih mapel dulu</option></select>
                        <input type="text" id="guru_manual" placeholder="Nama lengkap guru" class="hidden w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50">
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Kelas</label>
                        <select id="kelas" disabled class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50"><option value="" disabled selected>Pilih jenis presensi dulu</option></select>
                        <input type="text" id="kelas_manual" placeholder="Contoh: 12 IPA 1" class="hidden w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50">
                    </div>
                </div>
            </div>

            <!-- Card 2: Daftar Kehadiran Siswa -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6">
                <div class="flex items-center justify-between mb-5">
                    <div class="flex items-center gap-2">
                        <i data-lucide="users" class="w-5 h-5 text-primary"></i>
                        <h2 class="text-lg font-semibold text-slate-900">Daftar Kehadiran Siswa</h2>
                    </div>
                    <div class="text-sm text-slate-500"><span id="totalSiswa">0</span> siswa</div>
                </div>

                <div class="mb-4 relative">
                    <input type="text" id="searchSiswa" placeholder="Cari nama siswa..." class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none">
                </div>

                <div id="siswaList" class="space-y-2 max-h-96 overflow-y-auto p-2 border border-slate-100 rounded-xl bg-slate-50">
                    <p class="text-center text-slate-400 py-8">Pilih kelas untuk menampilkan daftar siswa</p>
                </div>

                <div class="mt-5 pt-5 border-t border-slate-100">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Tambah Siswa Manual (pisahkan dengan koma)</label>
                    <textarea id="siswaManual" rows="2" placeholder="Contoh: Ahmad Fauzi, Budi Santoso" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50 resize-none text-sm"></textarea>
                    <p class="text-xs text-slate-500 mt-1">* Siswa manual otomatis dianggap hadir</p>
                </div>

                <div class="mt-5 grid grid-cols-2 gap-3">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-emerald-600" id="statHadir">0</div>
                        <div class="text-xs text-emerald-700 font-medium">Siswa Hadir</div>
                    </div>
                    <div class="bg-rose-50 border border-rose-200 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-rose-600" id="statTidakHadir">0</div>
                        <div class="text-xs text-rose-700 font-medium">Tidak Hadir</div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button type="button" id="resetBtn" class="flex-1 px-6 py-4 border-2 border-slate-200 text-slate-600 font-semibold rounded-xl hover:bg-slate-50 transition-all">Reset Form</button>
                <button type="submit" id="submitBtn" class="flex-[2] bg-primary hover:bg-primaryDark text-white font-semibold py-4 px-6 rounded-xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-2 disabled:opacity-50">
                    <span>Simpan Presensi</span>
                </button>
            </div>
            </div>
        </form>

        <!-- Penanda versi: untuk memastikan versi yang aktif -->
        <p class="text-center text-xs text-slate-400 mt-8">v3 • Tim Sukses PTN Al Bayan</p>
    </main>

    <!-- Notification -->
    <div id="notification" class="fixed bottom-4 right-4 left-4 sm:left-auto sm:w-96 hidden z-50">
        <div class="bg-white rounded-xl shadow-2xl border-l-4 p-4 flex items-start gap-3">
            <div id="notifIcon"></div>
            <div class="flex-1">
                <h4 id="notifTitle" class="font-semibold text-sm mb-1"></h4>
                <p id="notifMessage" class="text-sm text-slate-600"></p>
            </div>
            <button type="button" onclick="closeNotification()" class="text-slate-400 hover:text-slate-600">✕</button>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydQLyp6LkW3Nvu1kyQ9v_n0FZfi-dAAzsoCCXEzUXZ18sUcYoljAmXxaPR5YTAK41QfQ/exec";
        const INTENSIVE = ['TKA', 'SNBT', 'IUP', 'Ujian Mandiri'];

        let allData = {};
        let dataReady = false;
        let currentMode = 'dropdown';
        let pendingJenis = null;

        function icons() { try { if (window.lucide) lucide.createIcons(); } catch (e) {} }

        async function loadAllData(attempt) {
            const banner = document.getElementById('loadBanner');
            const text = document.getElementById('loadBannerText');
            const spinner = document.getElementById('loadSpinner');
            banner.classList.remove('hidden');
            text.textContent = (attempt > 0) ? 'Mengulang memuat data...' : 'Memuat data guru & siswa...';

            try {
                const res = await fetch(APPS_SCRIPT_URL + '?action=getAllData');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                allData = await res.json();
                dataReady = true;
                banner.classList.add('hidden');
                if (pendingJenis) { applyJenis(pendingJenis); pendingJenis = null; }
            } catch (e) {
                if (attempt < 2) {
                    setTimeout(function(){ loadAllData(attempt + 1); }, 1500);
                } else {
                    spinner.classList.add('hidden');
                    text.innerHTML = 'Gagal memuat data. <button type="button" onclick="retryLoad()" class="underline font-semibold text-emerald-700">Coba lagi</button>';
                }
            }
        }

        function retryLoad() {
            document.getElementById('loadSpinner').classList.remove('hidden');
            loadAllData(0);
        }

        function applyJenis(jenis) {
            const d = allData[jenis];
            if (d && (d.mapel.length || d.kelas.length || d.guru.length)) {
                currentMode = 'dropdown';
                setMode('dropdown');
                populateSelect('mapel', d.mapel, 'Pilih Mapel...');
                populateSelect('kelas', d.kelas, 'Pilih Kelas...');
                const guruSel = document.getElementById('guru');
                guruSel.innerHTML = '<option value="" disabled selected>Pilih mapel dulu</option>';
                guruSel.disabled = true;
                document.getElementById('mapel').disabled = false;
                document.getElementById('kelas').disabled = false;
            } else {
                currentMode = 'manual';
                setMode('manual');
            }
            renderSiswaList([]);
        }

        function handleJenisChange() {
            const jenis = this.value;
            if (!dataReady && INTENSIVE.indexOf(jenis) !== -1) {
                pendingJenis = jenis;
                showNotification('info', 'Info', 'Data masih dimuat, pilihan akan terisi otomatis sebentar lagi.');
                return;
            }
            applyJenis(jenis);
        }

        function handleMapelChange() {
            const jenis = document.getElementById('jenis').value;
            const d = allData[jenis] || { guru: [] };
            const gurus = d.guru.filter(g => g.mapel === this.value).map(g => g.nama).sort();
            populateSelect('guru', gurus, 'Pilih Guru...');
            document.getElementById('guru').disabled = false;
        }

        function handleKelasChange() {
            const jenis = document.getElementById('jenis').value;
            const d = allData[jenis] || { siswa: [] };
            const siswas = d.siswa.filter(s => s.kelas === this.value).map(s => s.nama).sort();
            renderSiswaList(siswas);
        }

        function setMode(mode) {
            ['mapel', 'guru', 'kelas'].forEach(function(f) {
                const sel = document.getElementById(f);
                const inp = document.getElementById(f + '_manual');
                if (mode === 'dropdown') { sel.classList.remove('hidden'); inp.classList.add('hidden'); }
                else { sel.classList.add('hidden'); inp.classList.remove('hidden'); }
            });
        }

        function populateSelect(id, list, placeholder) {
            const sel = document.getElementById(id);
            sel.innerHTML = '<option value="" disabled selected>' + placeholder + '</option>';
            list.forEach(function(v) {
                const o = document.createElement('option');
                o.value = v; o.textContent = v;
                sel.appendChild(o);
            });
        }

        function renderSiswaList(siswaList) {
            const container = document.getElementById('siswaList');
            container.innerHTML = '';
            if (!siswaList || siswaList.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-8">Pilih kelas untuk menampilkan daftar siswa</p>';
                document.getElementById('totalSiswa').textContent = '0';
                updateStatistik();
                return;
            }
            document.getElementById('totalSiswa').textContent = siswaList.length;

            siswaList.forEach(function(siswa) {
                const label = document.createElement('label');
                label.className = 'siswa-item flex items-center gap-3 p-3 bg-white rounded-lg border border-slate-200 hover:border-primary transition-colors cursor-pointer';
                label.innerHTML =
                    '<input type="checkbox" name="siswaHadir" value="' + siswa + '" onchange="updateStatistik()" class="w-5 h-5 rounded cursor-pointer flex-shrink-0">' +
                    '<span class="font-medium text-slate-700">' + siswa + '</span>';
                container.appendChild(label);
            });
            updateStatistik();
        }

        function updateStatistik() {
            const hadir = document.querySelectorAll('input[name="siswaHadir"]:checked').length;
            const total = document.querySelectorAll('.siswa-item').length;
            document.getElementById('statHadir').textContent = hadir;
            document.getElementById('statTidakHadir').textContent = total - hadir;
        }

        function handleSearchSiswa() {
            const term = this.value.toLowerCase();
            document.querySelectorAll('.siswa-item').forEach(function(item) {
                item.style.display = item.querySelector('span').textContent.toLowerCase().indexOf(term) !== -1 ? 'flex' : 'none';
            });
        }

        function getFieldValue(field) {
            if (currentMode === 'dropdown') return document.getElementById(field).value || '';
            return document.getElementById(field + '_manual').value || '';
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const original = submitBtn.innerHTML;

            const guru = getFieldValue('guru');
            if (!guru) { showNotification('error', 'Validasi', 'Nama guru wajib diisi'); return; }

            const siswaHadir = Array.from(document.querySelectorAll('input[name="siswaHadir"]:checked')).map(cb => cb.value);
            const semuaSiswa = Array.from(document.querySelectorAll('.siswa-item input[name="siswaHadir"]')).map(cb => cb.value);
            const siswaTidakHadir = semuaSiswa.filter(s => siswaHadir.indexOf(s) === -1);

            const formData = {
                jenis: document.getElementById('jenis').value,
                tanggal: document.getElementById('tanggal').value,
                mapel: getFieldValue('mapel'),
                guru: guru,
                kelas: getFieldValue('kelas'),
                jp: document.getElementById('jp').value,
                siswaHadir: siswaHadir,
                siswaTidakHadir: siswaTidakHadir,
                siswaManual: document.getElementById('siswaManual').value
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Menyimpan...</span>';

            try {
                const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(formData) });
                const result = await res.json();
                if (result.status === 'success') {
                    showNotification('success', 'Berhasil!', 'Presensi tersimpan!<br>Hadir: ' + result.totalHadir + ' | Tidak Hadir: ' + result.totalTidakHadir);
                    handleReset();
                } else {
                    showNotification('error', 'Gagal', result.message);
                }
            } catch (err) {
                showNotification('error', 'Error', 'Terjadi kesalahan saat menyimpan');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = original;
            }
        }

        function handleReset() {
            document.getElementById('presensiForm').reset();
            try { document.getElementById('tanggal').valueAsDate = new Date(); } catch (e) {}
            ['mapel', 'guru', 'kelas'].forEach(function(f) { document.getElementById(f).disabled = true; });
            currentMode = 'dropdown';
            setMode('dropdown');
            renderSiswaList([]);
        }

        function showNotification(type, title, message) {
            const notif = document.getElementById('notification');
            notif.classList.remove('hidden');
            const icon = type === 'success' ? '✅' : (type === 'info' ? 'ℹ️' : '❌');
            document.getElementById('notifIcon').innerHTML = '<div class="text-xl">' + icon + '</div>';
            document.getElementById('notifTitle').textContent = title;
            document.getElementById('notifMessage').innerHTML = message;
            setTimeout(closeNotification, 5000);
        }

        function closeNotification() {
            document.getElementById('notification').classList.add('hidden');
        }

        function init() {
            icons();
            try { document.getElementById('tanggal').valueAsDate = new Date(); } catch (e) {}
            try {
                document.getElementById('jenis').addEventListener('change', handleJenisChange);
                document.getElementById('mapel').addEventListener('change', handleMapelChange);
                document.getElementById('kelas').addEventListener('change', handleKelasChange);
                document.getElementById('searchSiswa').addEventListener('input', handleSearchSiswa);
                document.getElementById('resetBtn').addEventListener('click', handleReset);
            } catch (e) { console.error(e); }
            loadAllData(0);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Guru - Sukses PTN Al Bayan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#059669', primaryDark: '#047857', background: '#F8FAFC' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        select:disabled { opacity: 0.5; cursor: not-allowed; }
        input[type="checkbox"] { accent-color: #059669; width: 1.25rem; height: 1.25rem; }
    </style>
</head>
<body class="bg-background text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center gap-3">
            <a href="https://suksesptn.github.io" class="text-slate-400 hover:text-primary transition-colors">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <div class="bg-primary text-white p-2 rounded-lg"><i data-lucide="clipboard-check" class="w-5 h-5"></i></div>
            <div>
                <h1 class="text-lg font-bold text-slate-900">Presensi Guru</h1>
                <p class="text-xs text-slate-500">Program Sukses PTN Al Bayan</p>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 w-full">
        <form id="presensiForm" onsubmit="submitForm(event)" class="space-y-6">

            <!-- Card 1: Informasi Presensi -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6">
                <div class="flex items-center gap-2 mb-5">
                    <i data-lucide="file-text" class="w-5 h-5 text-primary"></i>
                    <h2 class="text-lg font-semibold text-slate-900">Informasi Presensi</h2>
                </div>

                <!-- Banner Status -->
                <div id="loadBanner" class="mb-5 hidden flex items-center gap-3 text-sm bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3">
                    <span id="loadBannerText" class="text-emerald-700">Memuat data guru & siswa...</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Jenis Presensi <span class="text-rose-500">*</span></label>
                        <select id="jenis" onchange="switchJenis()" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50 font-medium">
                            <option value="" disabled selected>Pilih Jenis Presensi...</option>
                            <option value="TKA">Intensif TKA</option>
                            <option value="SNBT">Intensif SNBT</option>
                            <option value="IUP">Intensif IUP</option>
                            <option value="Ujian Mandiri">Intensif Ujian Mandiri</option>
                            <option value="Tambahan Sore">Tambahan Sore</option>
                            <option value="KBM Online">KBM Online</option>
                            <option value="Petugas KBM Online">Petugas KBM Online</option>
                            <option value="Pengawas Tryout">Pengawas Tryout</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Tanggal <span class="text-rose-500">*</span></label>
                        <input type="date" id="tanggal" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Jumlah JP <span class="text-rose-500">*</span></label>
                        <input type="number" id="jp" value="2" min="1" max="10" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50">
                    </div>

                    <div id="field_mapel">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Mata Pelajaran</label>
                        <select id="mapel" onchange="filterGuru()" disabled class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50">
                            <option value="">-- Pilih Mapel --</option>
                        </select>
                    </div>

                    <div id="guru_select_wrap">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Nama Guru <span class="text-rose-500">*</span></label>
                        <select id="guru" disabled class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50">
                            <option value="">-- Pilih Guru --</option>
                        </select>
                    </div>

                    <div id="guru_manual_wrap" class="hidden">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Nama Guru <span class="text-rose-500">*</span></label>
                        <input type="text" id="guru_manual" placeholder="Ketik nama lengkap" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50">
                    </div>

                    <div id="field_kelas" class="sm:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Kelas</label>
                        <select id="kelas" onchange="loadSiswa()" disabled class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50">
                            <option value="">-- Pilih Kelas --</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Card 2: Daftar Kehadiran Siswa -->
            <div id="card_siswa" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6">
                <div class="flex items-center justify-between mb-5">
                    <div class="flex items-center gap-2">
                        <i data-lucide="users" class="w-5 h-5 text-primary"></i>
                        <h2 class="text-lg font-semibold text-slate-900">Daftar Kehadiran Siswa</h2>
                    </div>
                    <div class="text-sm text-slate-500"><span id="totalSiswa">0</span> siswa</div>
                </div>

                <div class="mb-4 relative">
                    <input type="text" id="searchSiswa" oninput="handleSearchSiswa()" placeholder="Cari nama siswa..." class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none">
                </div>

                <div id="siswaList" class="space-y-2 max-h-96 overflow-y-auto p-2 border border-slate-100 rounded-xl bg-slate-50">
                    <p class="text-center text-slate-400 py-8">Pilih kelas untuk menampilkan daftar siswa</p>
                </div>

                <div class="mt-5 pt-5 border-t border-slate-100">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        <i data-lucide="user-plus" class="w-4 h-4 inline mr-1"></i>
                        Tambah Siswa Manual (pisahkan dengan koma)
                    </label>
                    <textarea id="siswaManual" rows="2" placeholder="Contoh: Ahmad Fauzi, Budi Santoso" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none bg-slate-50 resize-none text-sm"></textarea>
                    <p class="text-xs text-slate-500 mt-1">* Siswa manual otomatis dianggap hadir</p>
                </div>

                <div class="mt-5 grid grid-cols-2 gap-3">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-emerald-600" id="statHadir">0</div>
                        <div class="text-xs text-emerald-700 font-medium">Siswa Hadir</div>
                    </div>
                    <div class="bg-rose-50 border border-rose-200 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-rose-600" id="statTidakHadir">0</div>
                        <div class="text-xs text-rose-700 font-medium">Tidak Hadir</div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button type="button" onclick="resetForm()" class="flex-1 px-6 py-4 border-2 border-slate-200 text-slate-600 font-semibold rounded-xl hover:bg-slate-50 transition-all">
                    <i data-lucide="rotate-ccw" class="w-5 h-5 inline mr-2"></i>Reset Form
                </button>
                <button type="submit" id="submitBtn" class="flex-[2] bg-primary hover:bg-primaryDark text-white font-semibold py-4 px-6 rounded-xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-2 disabled:opacity-50">
                    <i data-lucide="save" class="w-5 h-5"></i><span>Simpan Presensi</span>
                </button>
            </div>
        </form>

        <p class="text-center text-xs text-slate-400 mt-8">v6 • Tim Sukses PTN Al Bayan</p>
    </main>

    <!-- Notification -->
    <div id="notification" class="fixed bottom-4 right-4 left-4 sm:left-auto sm:w-96 hidden z-50">
        <div class="bg-white rounded-xl shadow-2xl border-l-4 p-4 flex items-start gap-3">
            <div id="notifIcon"></div>
            <div class="flex-1">
                <h4 id="notifTitle" class="font-semibold text-sm mb-1"></h4>
                <p id="notifMessage" class="text-sm text-slate-600"></p>
            </div>
            <button type="button" onclick="closeNotification()" class="text-slate-400 hover:text-slate-600">✕</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-Z7Nd1x4OTB-_qOTKEcriyelXm7iXFrvty6xHjHMohGvoScKthLppd_rhsCc6RMev6Q/exec';
        
        const JENIS_MAP = {
            'TKA': { program: 'TKA', mode: 'checklist' },
            'SNBT': { program: 'SNBT', mode: 'checklist' },
            'IUP': { program: 'IUP', mode: 'checklist' },
            'Ujian Mandiri': { program: 'UM', mode: 'checklist' },
            'Tambahan Sore': { program: '', mode: 'manual' },
            'KBM Online': { program: '', mode: 'none' },
            'Petugas KBM Online': { program: '', mode: 'none' },
            'Pengawas Tryout': { program: '', mode: 'none' }
        };

        let masterData = { guru: [], siswa: [] };
        let dataLoaded = false;

        function icons() { try { if (window.lucide) lucide.createIcons(); } catch(e) {} }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', async function() {
            document.getElementById('tanggal').valueAsDate = new Date();
            await loadMasterData();
            icons();
        });

        async function loadMasterData() {
            const banner = document.getElementById('loadBanner');
            const bannerText = document.getElementById('loadBannerText');
            
            banner.classList.remove('hidden');
            banner.className = 'mb-5 flex items-center gap-3 text-sm bg-blue-50 border border-blue-200 rounded-xl px-4 py-3';
            bannerText.className = 'text-blue-700';
            bannerText.textContent = 'Memuat data guru & siswa...';
            
            try {
                const response = await fetch(SCRIPT_URL + '?action=getMasterData');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    masterData = result;
                    dataLoaded = true;
                    banner.className = 'mb-5 hidden';
                } else {
                    throw new Error(result.message || 'Data kosong');
                }
            } catch (error) {
                console.error('Load data error:', error);
                banner.className = 'mb-5 flex items-center gap-3 text-sm bg-rose-50 border border-rose-200 rounded-xl px-4 py-3';
                bannerText.className = 'text-rose-700 font-medium';
                bannerText.innerHTML = 'Gagal memuat data. <button type="button" onclick="loadMasterData()" class="underline font-bold">Coba lagi</button>';
            }
        }

        function show(id, visible) {
            const el = document.getElementById(id);
            if (visible) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function switchJenis() {
            if (!dataLoaded) {
                showNotification('info', 'Info', 'Data sedang dimuat. Silakan tunggu sebentar...');
                return;
            }
            
            const jenis = document.getElementById('jenis').value;
            const cfg = JENIS_MAP[jenis] || { program: '', mode: 'manual' };

            if (cfg.mode === 'checklist') {
                show('field_mapel', true);
                show('guru_select_wrap', true);
                show('guru_manual_wrap', false);
                show('field_kelas', true);
                show('card_siswa', true);
                updateMapelDropdown(cfg.program);
                updateKelasDropdown(cfg.program);
            } else if (cfg.mode === 'manual') {
                show('field_mapel', false);
                show('guru_select_wrap', false);
                show('guru_manual_wrap', true);
                show('field_kelas', false);
                show('card_siswa', false);
            } else {
                show('field_mapel', false);
                show('guru_select_wrap', false);
                show('guru_manual_wrap', true);
                show('field_kelas', false);
                show('card_siswa', false);
            }
            
            filterGuru();
            loadSiswa();
        }

        function updateMapelDropdown(program) {
            const select = document.getElementById('mapel');
            select.innerHTML = '<option value="">-- Pilih Mapel --</option>';
            select.disabled = false;
            
            const filtered = masterData.guru.filter(g => g.program === program);
            const unique = [...new Set(filtered.map(g => g.mapel).filter(Boolean))].sort();
            
            unique.forEach(m => {
                select.innerHTML += `<option value="${m}">${m}</option>`;
            });
        }

        function filterGuru() {
            if (!dataLoaded) return;
            
            const jenis = document.getElementById('jenis').value;
            const cfg = JENIS_MAP[jenis] || { program: '' };
            const mapelSelected = document.getElementById('mapel').value;
            const select = document.getElementById('guru');
            
            let list = masterData.guru.filter(g => g.program === cfg.program);
            if (mapelSelected) list = list.filter(g => g.mapel === mapelSelected);
            
            select.innerHTML = '<option value="">-- Pilih Guru --</option>';
            select.disabled = false;
            
            const seen = new Set();
            list.sort((a,b) => a.nama.localeCompare(b.nama)).forEach(g => {
                let label = g.nama;
                if (!mapelSelected && g.mapel) label = `${g.nama} (${g.mapel})`;
                if (!seen.has(label)) {
                    seen.add(label);
                    select.innerHTML += `<option value="${g.nama}">${label}</option>`;
                }
            });
        }

        function updateKelasDropdown(program) {
            const select = document.getElementById('kelas');
            select.innerHTML = '<option value="">-- Pilih Kelas --</option>';
            select.disabled = false;
            
            const unique = [...new Set(masterData.siswa.filter(s => s.program === program).map(s => s.kelas).filter(Boolean))].sort();
            
            unique.forEach(k => {
                select.innerHTML += `<option value="${k}">${k}</option>`;
            });
        }

        function loadSiswa() {
            if (!dataLoaded) return;
            
            const jenis = document.getElementById('jenis').value;
            const cfg = JENIS_MAP[jenis] || { program: '' };
            const kelasSelected = document.getElementById('kelas').value;
            const container = document.getElementById('siswaList');

            if (cfg.mode !== 'checklist') { 
                container.innerHTML = ''; 
                return; 
            }

            const daftar = masterData.siswa
                .filter(s => s.program === cfg.program && s.kelas === kelasSelected)
                .map(s => s.nama)
                .sort((a,b) => a.localeCompare(b));

            container.innerHTML = '';
            if (daftar.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-8">Pilih kelas untuk menampilkan daftar siswa</p>';
                document.getElementById('totalSiswa').textContent = '0';
                updateStatistik();
                return;
            }

            document.getElementById('totalSiswa').textContent = daftar.length;

            daftar.forEach((nama) => {
                const div = document.createElement('div');
                div.className = 'siswa-item flex items-center gap-3 p-3 bg-white rounded-lg border border-slate-200 hover:border-primary transition-colors cursor-pointer';
                div.innerHTML = `
                    <label class="flex items-center gap-3 flex-1 cursor-pointer">
                        <input type="checkbox" name="siswaHadir" value="${nama}" onchange="updateStatistik()" class="w-5 h-5 rounded cursor-pointer flex-shrink-0">
                        <span class="font-medium text-slate-700">${nama}</span>
                    </label>
                `;
                div.addEventListener('click', (e) => {
                    if (e.target.type !== 'checkbox') {
                        const cb = div.querySelector('input[type="checkbox"]');
                        cb.checked = !cb.checked;
                        updateStatistik();
                    }
                });
                container.appendChild(div);
            });
            updateStatistik();
        }

        function handleSearchSiswa() {
            const term = this.value.toLowerCase();
            document.querySelectorAll('.siswa-item').forEach(item => {
                item.style.display = item.querySelector('span').textContent.toLowerCase().includes(term) ? 'flex' : 'none';
            });
        }

        function updateStatistik() {
            const hadir = document.querySelectorAll('input[name="siswaHadir"]:checked').length;
            const total = document.querySelectorAll('.siswa-item').length;
            document.getElementById('statHadir').textContent = hadir;
            document.getElementById('statTidakHadir').textContent = total - hadir;
        }

        async function submitForm(e) {
            e.preventDefault();
            
            if (!dataLoaded) {
                showNotification('error', 'Error', 'Data belum siap. Silakan tunggu hingga data selesai dimuat.');
                return;
            }
            
            const jenis = document.getElementById('jenis').value;
            const cfg = JENIS_MAP[jenis] || { program: '', mode: 'manual' };
            const btn = document.getElementById('submitBtn');
            const original = btn.innerHTML;

            const guru = (cfg.mode === 'checklist') 
                ? document.getElementById('guru').value 
                : document.getElementById('guru_manual').value.trim();

            if (!guru) { 
                showNotification('error', 'Validasi', 'Nama guru wajib diisi'); 
                return; 
            }

            btn.disabled = true;
            btn.innerHTML = '<span>Menyimpan...</span>';

            const checked = Array.from(document.querySelectorAll('input[name="siswaHadir"]:checked')).map(cb => cb.value);
            const semua = Array.from(document.querySelectorAll('.siswa-item input[name="siswaHadir"]')).map(cb => cb.value);

            const payload = {
                jenis: jenis,
                program: cfg.program,
                tanggal: document.getElementById('tanggal').value,
                mapel: document.getElementById('mapel').value,
                guru: guru,
                kelas: document.getElementById('kelas').value,
                jp: parseInt(document.getElementById('jp').value) || 2,
                siswaHadir: checked,
                siswaTidakHadir: semua.filter(s => !checked.includes(s)),
                siswaManual: document.getElementById('siswaManual').value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                const res = await response.json();

                if (res.status === 'success') {
                    showNotification('success', 'Berhasil!', `Presensi tersimpan!<br>Hadir: ${res.totalHadir} | Tidak Hadir: ${res.totalTidakHadir}`);
                    resetForm();
                } else {
                    throw new Error(res.message || 'Gagal menyimpan');
                }
            } catch (err) {
                console.error('Submit error:', err);
                showNotification('error', 'Error', 'Terjadi kesalahan: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = original;
                icons();
            }
        }

        function resetForm() {
            document.getElementById('presensiForm').reset();
            document.getElementById('tanggal').valueAsDate = new Date();
            document.getElementById('mapel').disabled = true;
            document.getElementById('guru').disabled = true;
            document.getElementById('kelas').disabled = true;
            show('field_mapel', true);
            show('guru_select_wrap', true);
            show('guru_manual_wrap', false);
            show('field_kelas', true);
            show('card_siswa', true);
            document.getElementById('siswaList').innerHTML = '<p class="text-center text-slate-400 py-8">Pilih kelas untuk menampilkan daftar siswa</p>';
            document.getElementById('statHadir').textContent = '0';
            document.getElementById('statTidakHadir').textContent = '0';
            document.getElementById('totalSiswa').textContent = '0';
            icons();
        }

        function showNotification(type, title, message) {
            const notif = document.getElementById('notification');
            notif.classList.remove('hidden');
            
            const iconDiv = document.getElementById('notifIcon');
            if (type === 'success') {
                iconDiv.innerHTML = '<div class="w-8 h-8 bg-emerald-100 rounded-full flex items-center justify-center"><i data-lucide="check" class="w-5 h-5 text-emerald-600"></i></div>';
            } else if (type === 'info') {
                iconDiv.innerHTML = '<div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center"><i data-lucide="info" class="w-5 h-5 text-blue-600"></i></div>';
            } else {
                iconDiv.innerHTML = '<div class="w-8 h-8 bg-rose-100 rounded-full flex items-center justify-center"><i data-lucide="x" class="w-5 h-5 text-rose-600"></i></div>';
            }
            
            document.getElementById('notifTitle').textContent = title;
            document.getElementById('notifMessage').innerHTML = message;
            icons();
            
            setTimeout(closeNotification, 5000);
        }

        function closeNotification() {
            document.getElementById('notification').classList.add('hidden');
        }
    </script>
</body>
</html>
